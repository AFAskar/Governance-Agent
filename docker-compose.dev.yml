services:
  ai_service:
    build:
      context: .
      dockerfile: ai.dockerfile
    ports:
      - "5050:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    volumes:
      - ./services/ai-service:/app
      - ./test_samples:/app/test_samples
      - /app/.venv
    depends_on:
      vector_db:
        condition: service_healthy
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./services/ai-service/src
          target: /app/src

  frontend:
    build:
      context: .
      dockerfile: next.dockerfile
      target: development
    ports:
      - "5001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    volumes:
      - ./apps/tanstack-start:/app/apps/tanstack-start
      - ./packages:/app/packages
      - ./tooling:/app/tooling
      - /app/node_modules
      - /app/apps/tanstack-start/node_modules
    depends_on:
      - ai_service
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./apps/tanstack-start/src
          target: /app/apps/tanstack-start/src
        - action: rebuild
          path: ./apps/tanstack-start/package.json

  application_db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    ports:
      - "5432:5432"
    volumes:
      - db_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  vector_db:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    container_name: qdrant_dev
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_dev_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db_dev_data:
    driver: local
  qdrant_dev_data:
    driver: local
