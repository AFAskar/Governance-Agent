# Production overlay. Always use it together with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# It does two things the base file must not do on a public server:
#   1. Closes the database and vector-store ports. The base file publishes
#      5432 and 6333 to the host, which on a VPS means the open internet.
#   2. Puts Caddy in front as the only public entry point, with HTTPS and
#      timeouts long enough to outlast an evaluation.
services:
  application_db:
    ports: []

  vector_db:
    ports: []

  ai_service:
    # Reachable from the frontend over the compose network, not from outside.
    ports: []

  frontend:
    ports: []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
