[project]
name = "ai-service"
version = "0.1.0"
description = "Compliance framework extraction and AI evaluation service (FastAPI + LangGraph + Qdrant RAG)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "pdfplumber>=0.10.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    # Removed pypdf (redundant with pdfplumber)
    # Removed ipykernel (only needed for dev/notebooks)
    "qdrant-client>=1.8.0",
    "haystack-ai>=2.0.0",
    "transformers>=4.35.0",
    # torch installed separately as CPU-only in Dockerfile
    "sentence-transformers>=2.2.0",
    "accelerate>=0.24.0",
    "python-multipart>=0.0.9",
    "aiofiles>=24.0.0",
    "fastapi>=0.128.0",
    "groq>=0.4.0",
    "langchain-groq>=0.2.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "reportlab>=4.0.0",
    "python-docx>=1.0.0",
    "python-pptx>=0.6.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "uvicorn>=0.40.0",
]

[tool.uv]
# Exclude torch from uv sync since we install CPU version manually
override-dependencies = [
    "torch==2.5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["test.ipynb"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # import sorting
    "B",  # bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501",  # long lines: mostly prompts and log messages; formatter handles code
    "B008",  # FastAPI File()/Form() in route signatures (framework convention)
    "B904",  # raise-from in legacy error handlers; safe to tighten incrementally
]

[tool.ruff.lint.per-file-ignores]
# HF_HUB_OFFLINE must be set before any HuggingFace import
"src/embeddings/gemma_embedder.py" = ["E402"]
# Legacy scoring module; docstrings contain intentional blank lines with spacing
"src/Tools/oe.py" = ["W293"]

[tool.pytest.ini_options]
testpaths = ["tests"]


