services:
  ai_service:
    build:
      context: .
      dockerfile: ai.dockerfile
    ports:
      - "5000:8000"
    environment:
      - PYTHONPATH=/app/src
    depends_on:
      vector_db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: next.dockerfile
    ports:
      - "5001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - ai_service
    restart: unless-stopped

  vector_db:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    expose:
      - 6333
      - 6334
      - 6335
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  application_db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
configs:
  qdrant_config:
    content: |
      log_level: INFO

volumes:
  db_data:
    driver: local
  qdrant_data:
    driver: local
